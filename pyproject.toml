[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statmate"
version = "0.1.0"
description = "免费的 macOS 中文统计分析软件"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.7,<7", "pandas>=2.2,<3", "numpy>=1.26,<3", "scipy>=1.13,<2", "statsmodels>=0.14,<0.15", "pyreadstat>=1.2,<2", "matplotlib>=3.8,<4", "openpyxl>=3.1,<4", "xlrd>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.10,<7"]

[project.scripts]
statmate = "statmate.app:main"

[tool.setuptools.packages.find]
include = ["statmate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
